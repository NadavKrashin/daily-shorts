[project]
name = "waitwhy"
version = "0.1.0"
description = "Wait, Why? - automated animated educational shorts studio"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "httpx>=0.27",
  "anthropic>=1.0",
  "boto3>=1.34",
  "pillow>=10.4",
  "numpy>=2.0",
  "python-multipart>=0.0.9",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
localtts = ["piper-tts>=1.3"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
waitwhy = "waitwhy.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["waitwhy*"]

[tool.setuptools.package-data]
waitwhy = ["prompts/*.md", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

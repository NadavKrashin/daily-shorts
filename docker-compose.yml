# Local + small-server deployment. `docker compose up -d` then open http://localhost:8000
# Secrets come from .env (never committed). See docs/deployment.md.
x-app: &app
  build: .
  image: waitwhy:latest
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://waitwhy:${POSTGRES_PASSWORD:-waitwhy}@db:5432/waitwhy
  volumes:
    - media:/data/media
    - backups:/backups
    # The episode log pushed by the scheduled production runs. Keep it current on the host with
    # `git pull` (see docs/deployment.md); the import_episodes job reads it every 30 minutes.
    - ./channel:/app/channel:ro
  depends_on:
    db: {condition: service_healthy}
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: waitwhy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waitwhy}
      POSTGRES_DB: waitwhy
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waitwhy"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["sh", "-c", "waitwhy migrate && waitwhy init"]
    restart: "no"

  api:
    <<: *app
    command: ["waitwhy", "api", "--port", "8000"]
    ports: ["${API_PORT:-8000}:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}

  worker:
    <<: *app
    command: ["waitwhy", "worker"]
    stop_grace_period: 10m        # let an in-flight render/upload finish (graceful shutdown)
    depends_on:
      migrate: {condition: service_completed_successfully}

  scheduler:
    <<: *app
    command: ["waitwhy", "scheduler"]
    depends_on:
      migrate: {condition: service_completed_successfully}

  # Optional S3-compatible storage for local testing of the S3 adapter: `docker compose --profile s3 up`
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minio-secret}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

volumes:
  pgdata: {}
  media: {}
  backups: {}
  minio: {}
